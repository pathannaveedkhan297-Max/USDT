<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CSS Program 07</title>
<style>body{height:1200px}.static{position:static;background:#ddd;padding:10px}.relative{position:relative;left:30px;background:#bfdbfe;padding:10px}.parent{position:relative;height:180px;background:#fecaca}.parent span{position:absolute;right:20px;top:30px;background:#f97316;padding:20px}.fixed{position:fixed;right:10px;bottom:10px;background:#111;color:white;padding:10px}.sticky{position:sticky;top:0;background:gold;padding:10px}</style>
</head>
<body><div class="static">Static</div><div class="relative">Relative</div><div class="parent"><span>Absolute</span></div><div class="fixed">Fixed</div><div class="sticky">Sticky</div></body>
</html>
