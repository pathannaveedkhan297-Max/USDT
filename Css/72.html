<!DOCTYPE html>
<html>
<head>
<title>72. Responsive Typography</title>
<style>
body{margin:0;padding:30px;font-family:Georgia;background:#f0fdf4;color:#14532d}
h1{font-size:10vw;text-align:center}
p{font-size:calc(13px + 0.6vw);line-height:1.7;max-width:700px;margin:auto}
.box{padding:20px;background:#dcfce7;border-radius:12px}
@media(min-width:800px){h1{font-size:4rem}}
</style>
</head>
<body>
<div class="box">
<h1>Explore Nature</h1>
<p>Enjoy beautiful places, fresh air, and peaceful surroundings. This text automatically changes size to remain comfortable on different screen sizes.</p>
</div>
</body>
</html>
