<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CSS Program 54</title>
<style>.contact{max-width:700px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:15px}.contact textarea,.contact button{grid-column:1/3;padding:12px}.contact input{padding:12px}@media(max-width:600px){.contact{grid-template-columns:1fr}.contact textarea,.contact button{grid-column:auto}}</style>
</head>
<body><form class="contact"><input placeholder="Name"><input placeholder="Email"><textarea placeholder="Message"></textarea><button>Send</button></form></body>
</html>
