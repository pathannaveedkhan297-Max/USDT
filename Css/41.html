<style>.tooltip{position:relative;display:inline-block;background:#2563eb;color:white;padding:15px;margin:50px}.tip{visibility:hidden;position:absolute;bottom:120%;left:50%;background:#111;padding:8px;white-space:nowrap}.tooltip:hover .tip{visibility:visible}</style>
