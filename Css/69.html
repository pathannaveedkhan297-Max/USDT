<!DOCTYPE html>
<html>
<head>
<title>69. Sliding Card Animation</title>
<style>
body{margin:0;background:#fff7ed;font-family:Arial}
@keyframes move{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.card{width:250px;padding:25px;margin:100px auto;background:#f97316;color:white;text-align:center;border-radius:15px;animation:move 1s ease}
.card h2{margin:5px}
.card p{font-size:14px}
</style>
</head>
<body>
<div class="card">
<h2>Welcome!</h2>
<p>Discover our new collection.</p>
</div>
</body>
</html>
