<!DOCTYPE html>
<html>
<head>
<title>Student Profile</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center}
.profile{width:450px;background:white;padding:35px;border-radius:25px;text-align:center;box-shadow:0 20px 50px #0005}
.profile img{width:140px;height:140px;border-radius:50%;object-fit:cover;border:6px solid #667eea}
h1{margin:18px 0 5px;color:#222;font-size:26px}h3{margin:0 0 25px;color:#667eea;font-weight:normal}
table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:12px}
td{padding:14px;text-align:left;border-bottom:1px solid #eee}
td:first-child{font-weight:bold;color:#667eea;background:#f3f5ff;width:40%}
tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<div class="profile">
<img src="student.jpg" alt="Student Photo">
<h1>PATHAN NAVEED KHAN</h1>
<h3>🎓 B.Tech Student</h3>
<table>
<tr><td>COLLEGE</td><td>SAI UNIVERSITY</td></tr>
<tr><td>COURSE</td><td>B.TECH</td></tr>
<tr><td>DEPARTMENT</td><td>COMPUTER SCIENCE</td></tr>
<tr><td>YEAR</td><td>FIRST YEAR</td></tr>
</table>
</div>
</body>
</html>
