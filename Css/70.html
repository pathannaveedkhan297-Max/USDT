<!DOCTYPE html>
<html>
<head>
<title>70. CSS Modal</title>
<style>
body{font-family:Arial;text-align:center;background:#ecfeff}
button,a{padding:12px 20px;background:#0891b2;color:white;text-decoration:none;border:0;border-radius:8px}
.overlay{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}
.overlay:target{display:flex}
.popup{background:white;width:280px;padding:25px;border-radius:15px;position:relative}
.close{position:absolute;right:15px;top:10px;color:#dc2626;background:none}
.popup h2{color:#0891b2}
.popup p{color:#555}
</style>
</head>
<body>
<h1>Welcome</h1>
<p>Click below to see more information.</p>
<a href="#info">Show Info</a>
<div id="info" class="overlay">
<div class="popup">
<a href="#" class="close">✕</a>
<h2>Information</h2>
<p>Thanks for visiting our website!</p>
</div>
</div>
</body>
</html>
