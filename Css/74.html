<!DOCTYPE html>
<html>
<head>
<title>74. CSS calc() Function</title>
<style>
body{margin:0;font-family:Arial;background:#fff7ed}
header{background:#c2410c;color:white;padding:20px;text-align:center}
.container{padding:20px}
.content{width:calc(100% - 40px);margin:auto;background:#fed7aa;padding:20px}
.cards{display:flex;gap:20px}
.card{width:calc(50% - 10px);padding:30px;background:#fb923c;color:white;text-align:center;border-radius:12px}
.card:hover{background:#9a3412}
h2{margin:0 0 10px}
p{color:#7c2d12}
footer{text-align:center;padding:15px;background:#431407;color:white;margin-top:20px}
</style>
</head>
<body>
<header><h1>My Creative Space</h1></header>
<div class="container"><div class="content"><h2>Welcome</h2><p>CSS calc() helps create flexible layouts.</p><div class="cards"><div class="card">Design</div><div class="card">Coding</div></div></div></div>
<footer>Built with CSS</footer>
</body>
</html>
