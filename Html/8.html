<!DOCTYPE html>
<html>
<head>
    <title>Semantic HTML</title>

    <style>
        header {
            background-color: darkblue;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: lightgray;
            padding: 15px;
        }

        section {
            padding: 20px;
        }

        article {
            background-color: lightblue;
            padding: 20px;
        }

        footer {
            background-color: darkblue;
            color: white;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a> |
        <a href="#">About</a> |
        <a href="#">Contact</a>
    </nav>

    <section>

        <h2>Web Development</h2>

        <article>
            <h3>HTML</h3>
            <p>
                HTML is used to create the structure of webpages.
            </p>
        </article>

    </section>

    <footer>
        <p>Copyright © 2026 My Website</p>
    </footer>

</body>
</html>
