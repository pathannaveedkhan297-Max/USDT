<!DOCTYPE html>
<html lang="en">
<head>
    <title>Images and Hyperlinks</title>
    <style>
        body{text-align:center;background:#e3f2fd;font-family:Arial;padding:30px}
        .box{background:white;padding:25px;border-radius:15px;max-width:600px;margin:auto}
        img{width:300px;border-radius:15px;border:4px solid #1976d2}
        a{display:inline-block;background:#1976d2;color:white;padding:12px 25px;
          text-decoration:none;border-radius:8px}
        a:hover{background:#0d47a1}
    </style>
</head>
<body>
<div class="box">
    <h1>Images & Hyperlinks</h1>
    <h2>Image</h2>
    <img src="MAXX.jpeg" alt="Sample Image">
    <h2>Hyperlink</h2>
    <p>Visit Google:</p>
    <a href="https://www.google.com" target="_blank">Click Here</a>
</div>
</body>
</html>
