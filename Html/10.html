<!DOCTYPE html>
<html>
<head>
    <title>College Timetable</title>

    <style>
        table {
            border-collapse: collapse;
            width: 90%;
        }

        th, td {
            border: 2px solid black;
            padding: 15px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }

        .break {
            background-color: lightyellow;
        }
    </style>
</head>

<body>

    <h1>College Timetable</h1>

    <table>

        <tr>
            <th>Day</th>
            <th>9:00 - 10:00</th>
            <th>10:00 - 11:00</th>
            <th>11:00 - 12:00</th>
            <th>12:00 - 1:00</th>
            <th>2:00 - 3:00</th>
        </tr>

        <tr>
            <th>Monday</th>
            <td>HTML</td>
            <td>CSS</td>
            <td>JavaScript</td>
            <td class="break">Lunch</td>
            <td>Maths</td>
        </tr>

        <tr>
            <th>Tuesday</th>
            <td>Java</td>
            <td>HTML</td>
            <td>CSS</td>
            <td class="break">Lunch</td>
            <td>English</td>
        </tr>

        <tr>
            <th>Wednesday</th>
            <td>CSS</td>
            <td>JavaScript</td>
            <td>Maths</td>
            <td class="break">Lunch</td>
            <td>Java</td>
        </tr>

        <tr>
            <th>Thursday</th>
            <td>HTML</td>
            <td>Java</td>
            <td>English</td>
            <td class="break">Lunch</td>
            <td>CSS</td>
        </tr>

        <tr>
            <th>Friday</th>
            <td>JavaScript</td>
            <td>Maths</td>
            <td>HTML</td>
            <td class="break">Lunch</td>
            <td>Project</td>
        </tr>

    </table>

</body>
</html>
