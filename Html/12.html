<!DOCTYPE html>
<html>
<head>
    <title>CSS Properties</title>

    <style>

        /* Element selector */
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        /* ID selector */
        #heading {
            color: darkblue;
            text-align: center;
            font-size: 40px;
        }

        /* Class selector */
        .paragraph {
            color: darkgreen;
            font-size: 20px;
            margin: 20px;
            padding: 20px;
            border: 3px solid green;
            background-color: lightgreen;
        }

        /* Group selector */
        h2, h3 {
            color: purple;
        }

    </style>
</head>

<body>

    <h1 id="heading">CSS Selectors</h1>

    <h2>Colors and Fonts</h2>

    <p class="paragraph">
        This paragraph demonstrates colors, fonts, margins,
        padding and borders.
    </p>

    <h3>CSS Practice</h3>

</body>
</html>
