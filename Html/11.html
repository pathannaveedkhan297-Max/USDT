<!DOCTYPE html>
<html>
<head>
    <title>Internal and External CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Internal CSS</h1>

    <p>
        This paragraph is styled using internal CSS.
    </p>

    <div class="box">
        This box is styled using external CSS.
    </div>

</body>
</html>
