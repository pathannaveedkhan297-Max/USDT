<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>

    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>Student Details</h1>

    <table>

        <tr>
            <th colspan="3">Student Information</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>20</td>
            <td>HTML</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>21</td>
            <td>CSS</td>
        </tr>

        <tr>
            <td rowspan="2">Arun</td>
            <td>22</td>
            <td>JavaScript</td>
        </tr>

        <tr>
            <td>22</td>
            <td>Web Development</td>
        </tr>

    </table>

</body>
</html>
