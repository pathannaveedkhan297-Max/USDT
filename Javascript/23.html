<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>24. Click Counter</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial;background:linear-gradient(120deg,#141e30,#243b55)}
.card{width:360px;padding:35px;text-align:center;background:#fff;border-radius:18px;box-shadow:0 12px 30px #0008}
h1{color:#243b55;margin-bottom:10px}.count{font-size:55px;font-weight:bold;color:#e63946;margin:20px}
button{padding:14px 35px;border:0;border-radius:30px;background:#e63946;color:white;font-size:18px;cursor:pointer}
button:hover{background:#c1121f;transform:scale(1.05)}p{color:#666}
</style></head>
<body><div class="card"><h1>🔘 Click Counter</h1><p>Click the button to increase the counter</p>
<div class="count" id="output">0</div><button id="btn">CLICK ME</button></div>
<script>
let count=0;
document.getElementById("btn").addEventListener("click",()=>{
count++;document.getElementById("output").textContent=count;
});
</script></body></html>
