<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>45. Local Storage Notes</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#00b09b,#96c93d);height:100vh;display:flex;justify-content:center;align-items:center}
.box{background:white;padding:30px;border-radius:15px;width:350px;text-align:center;box-shadow:0 10px 25px #0004}
textarea{width:100%;height:100px;padding:10px;border:1px solid #ccc;border-radius:8px;resize:none}
button{margin:10px 5px;padding:10px 18px;border:0;border-radius:7px;background:#00a884;color:white;cursor:pointer}
button:hover{background:#007f66}#output{background:#f1f1f1;padding:12px;border-radius:8px;word-wrap:break-word}
</style></head>
<body><div class="box">
<h2>📝 My Notes</h2><textarea id="note" placeholder="Write your note here..."></textarea>
<br><button onclick="save()">Save Note</button><button onclick="load()">Load Note</button>
<p id="output">Your saved note will appear here.</p></div>
<script>
function save(){let n=document.getElementById("note").value;localStorage.setItem("myNote",n);document.getElementById("output").textContent="✅ Note saved successfully!";}
function load(){let n=localStorage.getItem("myNote")||"No note saved yet.";document.getElementById("note").value=n;document.getElementById("output").textContent="📌 Saved Note: "+n;}
</script></body></html>
