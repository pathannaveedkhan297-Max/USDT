<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>24. Button Click Event</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial;background:linear-gradient(135deg,#ff6a00,#ee0979)}
.card{background:#fff;padding:40px;border-radius:25px;text-align:center;width:350px;box-shadow:0 15px 35px #0005}h2{color:#333}
button{padding:14px 30px;border:0;border-radius:12px;background:#ee0979;color:white;font-size:16px;cursor:pointer}
button:hover{background:#c7005d;transform:scale(1.05)}#output{margin-top:25px;padding:15px;background:#fff0f6;border-radius:10px;color:#ee0979;font-weight:bold}
</style></head>
<body><div class="card"><h2>🖱️ Button Click</h2>
<p>Press the button to count your clicks.</p><button id="btn">Click Me!</button><p id="output">Clicks: 0</p></div>
<script>
let count=0;
document.getElementById("btn").addEventListener("click",function(){
count++;document.getElementById("output").textContent=`🎉 You clicked ${count} time(s)!`;
});
</script></body></html>
