<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>25. Show Hide Element</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial;background:linear-gradient(135deg,#00c6ff,#0072ff)}
.box{background:white;padding:35px;border-radius:20px;text-align:center;width:350px;box-shadow:0 15px 30px #0005}h2{color:#333}
#content{padding:20px;background:#e8f4ff;border-radius:10px;margin:20px 0;color:#0072ff}
button{padding:12px 25px;border:0;border-radius:8px;background:#0072ff;color:white;cursor:pointer}button:hover{background:#005fcc}
</style></head>
<body><div class="box"><h2>👁️ Show / Hide</h2>
<div id="content">✨ This content can be hidden or displayed!</div><button onclick="toggle()">Hide Content</button></div>
<script>
function toggle(){let b=document.getElementById("content"),x=event.target;
if(b.style.display==="none"){b.style.display="block";x.textContent="Hide Content";}else{b.style.display="none";x.textContent="Show Content";}}
</script></body></html>
