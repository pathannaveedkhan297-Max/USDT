<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>36. Countdown Timer</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial;background:linear-gradient(135deg,#141e30,#243b55)}
.box{background:white;padding:35px;border-radius:20px;text-align:center;box-shadow:0 15px 35px #0005;width:320px}h2{color:#243b55}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:10px 0;font-size:16px}
button{padding:12px 30px;background:#243b55;color:white;border:0;border-radius:8px;cursor:pointer}button:hover{background:#141e30}
#timer{font-size:45px;font-weight:bold;color:#e74c3c;margin-top:25px}
</style></head>
<body><div class="box"><h2>⏳ Countdown Timer</h2>
<input id="secondsInput" type="number" value="10" min="1" placeholder="Seconds">
<button onclick="startCountdown()">Start Timer</button><div id="timer">00:00</div></div>
<script>
let interval;
function pad(n){return String(n).padStart(2,"0");}
function startCountdown(){clearInterval(interval);let r=parseInt(document.getElementById("secondsInput").value)||0;
function show(){let m=Math.floor(r/60),s=r%60;document.getElementById("timer").textContent=`${pad(m)}:${pad(s)}`;}
show();interval=setInterval(()=>{r--;show();if(r<=0){clearInterval(interval);alert("⏰ Time's Up!");}},1000);}
</script></body></html>
