<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>28. Simple Calculator</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial;background:linear-gradient(135deg,#232526,#414345)}
.box{background:#222;padding:25px;border-radius:20px;width:300px;box-shadow:0 15px 30px #0008;text-align:center}
h2{color:white}input,select{width:100%;padding:12px;margin:7px 0;border:0;border-radius:8px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:8px;background:#00c853;color:white;font-size:18px;cursor:pointer}
button:hover{background:#00a844}#result{color:#00e676;font-size:20px;font-weight:bold;margin-top:18px}
</style></head>
<body><div class="box"><h2>🧮 Calculator</h2>
<input id="num1" type="number" placeholder="First Number"><select id="op"><option>+</option><option>-</option><option>*</option><option>/</option></select>
<input id="num2" type="number" placeholder="Second Number"><button onclick="calculate()">Calculate</button><div id="result">Result: —</div></div>
<script>
function calculate(){let a=+num1.value,b=+num2.value,o=op.value,r;
if(o==="+")r=a+b;else if(o==="-")r=a-b;else if(o==="*")r=a*b;else r=b?a/b:"Cannot divide by 0";
document.getElementById("result").textContent="Result: "+r;}
</script></body></html>
