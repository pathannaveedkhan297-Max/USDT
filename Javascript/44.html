<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Dynamic API Users</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);padding:30px}h1{text-align:center;color:white}
#userList{max-width:700px;margin:auto;padding:0;list-style:none}
li{background:white;margin:12px 0;padding:18px;border-radius:12px;box-shadow:0 4px 10px #3335}
li:hover{transform:translateY(-3px);background:#f0f4ff}
</style></head>
<body>
<h1>👥 User Directory</h1>
<ul id="userList"><li>Loading users...</li></ul>
<script>
async function loadUsers(){
try{
let res=await fetch("https://jsonplaceholder.typicode.com/users"),users=await res.json();
let emails=["student1@gmail.com","student2@gmail.com","student3@gmail.com","student4@gmail.com","student5@gmail.com"];
document.getElementById("userList").innerHTML=users.map((u,i)=>
`<li><strong>👤 ${u.name}</strong><br>📧 ${emails[i]||"student@gmail.com"}<br>🏠 ${u.address.city}</li>`).join("");
}catch(e){document.getElementById("userList").innerHTML="<li>❌ Failed to load users</li>";}
}
loadUsers();
</script></body></html>
