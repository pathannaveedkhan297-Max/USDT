<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>47. Interactive Task List</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#ff9966,#ff5e62);min-height:100vh;display:flex;justify-content:center;align-items:center}
.box{background:white;width:90%;max-width:500px;padding:30px;border-radius:20px;box-shadow:0 15px 30px #0004}h2{text-align:center;color:#444}
input{width:75%;padding:12px;border:1px solid #ddd;border-radius:8px}#add{padding:12px;background:#ff5e62;color:white;border:0;border-radius:8px;cursor:pointer}
ul{padding:0;list-style:none}li{display:flex;justify-content:space-between;background:#f5f5f5;margin:8px 0;padding:12px;border-radius:8px}
li button{border:0;background:#e74c3c;color:white;border-radius:5px;cursor:pointer}#counter{text-align:center;color:#666}
</style></head>
<body><div class="box"><h2>✅ My Task List</h2>
<input id="taskInput" placeholder="Enter a new task"><button id="add" onclick="addTask()">Add</button>
<ul id="list"></ul><p id="counter">Total Tasks: 0</p></div>
<script>
let count=0;
function addTask(){let input=document.getElementById("taskInput"),text=input.value.trim();if(!text)return;
let li=document.createElement("li");li.innerHTML=`<span>📌 ${text}</span><button onclick="this.parentElement.remove();update(-1)">✕</button>`;
document.getElementById("list").appendChild(li);input.value="";update(1);}
function update(n){count+=n;document.getElementById("counter").textContent="Total Tasks: "+count;}
</script></body></html>
