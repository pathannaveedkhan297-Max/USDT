<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>35. Stopwatch</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial;background:linear-gradient(135deg,#232526,#414345)}
.box{background:white;padding:35px;border-radius:20px;text-align:center;width:350px;box-shadow:0 15px 35px #0006}h2{color:#333}
#time{font-size:45px;font-weight:bold;color:#e74c3c;margin:25px 0}
button{padding:12px 18px;margin:5px;border:0;border-radius:8px;color:white;cursor:pointer}
.start{background:#27ae60}.stop{background:#e67e22}.reset{background:#e74c3c}button:hover{opacity:.8}
</style></head>
<body><div class="box"><h2>⏱️ Stopwatch</h2>
<div id="time">00:00:00</div><button class="start" onclick="start()">Start</button>
<button class="stop" onclick="stop()">Stop</button><button class="reset" onclick="reset()">Reset</button></div>
<script>
let seconds=0,interval=null;
function pad(n){return String(n).padStart(2,"0");}
function render(){let h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;document.getElementById("time").textContent=`${pad(h)}:${pad(m)}:${pad(s)}`;}
function start(){if(!interval)interval=setInterval(()=>{seconds++;render()},1000);}
function stop(){clearInterval(interval);interval=null;}
function reset(){stop();seconds=0;render();}
</script></body></html>
